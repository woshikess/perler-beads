    <!-- B36 开场动画：样式内联，且自身不依赖任何模块（要的就是「模块还没到也能显示」） -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
        background: #f4f2ed;
        color: #6a6f78;
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: .3px;
      }
      #boot.gone { opacity: 0; transition: opacity 320ms ease; pointer-events: none; }
      #boot .boot-heart-wrap { animation: bootBeat 1700ms ease-in-out infinite; transform-origin: center; }
      @keyframes bootBeat {
        0%, 100% { transform: scale(1); }
        14% { transform: scale(1.07); }
        28% { transform: scale(.99); }
        42% { transform: scale(1.045); }
        56% { transform: scale(1); }
      }
      #boot .boot-heart { display: grid; grid-template-columns: repeat(11, 16px); gap: 3px; }
      #boot .boot-heart i {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        opacity: 0;
        transform: scale(.55);
        /* 第三条（重画循环）的时长在下面按 CYCLE_MS 写死；每条 animation 共用同一个 delay 列表 */
        animation: bootBeadIn 260ms cubic-bezier(.2, .8, .3, 1.2) both, bootOutline 70ms ease-in-out both, bootReplay 10150ms linear both;
      }
      @keyframes bootBeadIn {
        from { opacity: 0; transform: scale(.55); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes bootOutline {
        from { box-shadow: 0 0 0 0 rgba(240, 200, 75, 0); }
        50% { box-shadow: 0 0 0 3px rgba(240, 200, 75, .55); }
        to { box-shadow: 0 0 0 0 rgba(240, 200, 75, 0); }
      }
      @keyframes bootReplay {
        0%, 88% { opacity: 1; }
        100% { opacity: 0; }
      }
      #boot .boot-text::after { content: '...'; animation: bootDots 1.4s steps(4, end) infinite; }
      @keyframes bootDots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75%, 100% { content: '...'; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-heart i { opacity: 1; transform: none; animation: none; }
        #boot .boot-heart-wrap { animation: none; }
        #boot .boot-text::after { content: '...'; animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

yle="grid-area:6/5;background:#17656a;animation-delay:2640ms,7210ms,0ms"></i><i style="grid-area:6/6;background:#17656a;animation-delay:2695ms,7280ms,0ms"></i><i style="grid-area:6/7;background:#17656a;animation-delay:2750ms,7350ms,0ms"></i><i style="grid-area:6/8;background:#17656a;animation-delay:2805ms,7420ms,0ms"></i><i style="grid-area:6/9;background:#f0c84b;animation-delay:2860ms,7490ms,0ms"></i><i style="grid-area:6/10;background:#17656a;animation-delay:2915ms,7560ms,0ms"></i><i style="grid-area:7/3;background:#17656a;animation-delay:2970ms,7630ms,0ms"></i><i style="grid-area:7/4;background:#17656a;animation-delay:3025ms,7700ms,0ms"></i><i style="grid-area:7/5;background:#17656a;animation-delay:3080ms,7770ms,0ms"></i><i style="grid-area:7/6;background:#17656a;animation-delay:3135ms,7840ms,0ms"></i><i style="grid-area:7/7;background:#17656a;animation-delay:3190ms,7910ms,0ms"></i><i style="grid-area:7/8;background:#f0c84b;animation-delay:3245ms,7980ms,0ms"></i><i style="grid-area:7/9;background:#17656a;animation-delay:3300ms,8050ms,0ms"></i><i style="grid-area:8/4;background:#17656a;animation-delay:3355ms,8120ms,0ms"></i><i style="grid-area:8/5;background:#17656a;animation-delay:3410ms,8190ms,0ms"></i><i style="grid-area:8/6;background:#17656a;animation-delay:3465ms,8260ms,0ms"></i><i style="grid-area:8/7;background:#17656a;animation-delay:3520ms,8330ms,0ms"></i><i style="grid-area:8/8;background:#17656a;animation-delay:3575ms,8400ms,0ms"></i><i style="grid-area:9/5;background:#f0c84b;animation-delay:3630ms,8470ms,0ms"></i><i style="grid-area:9/6;background:#17656a;animation-delay:3685ms,8540ms,0ms"></i><i style="grid-area:9/7;background:#17656a;animation-delay:3740ms,8610ms,0ms"></i><i style="grid-area:10/6;background:#17656a;animation-delay:3795ms,8680ms,0ms"></i></div></div>
      <div class="boot-text" id="bootText">正在加载</div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        var root = document.getElementById('root');
        if (!boot || !root) return;
        // 壳是静态 HTML，拿不到项目 i18n，这里按浏览器语言粗切一下（只影响这两个词）
        var zh = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0;
        var bootText = document.getElementById('bootText');
        if (bootText && !zh) bootText.textContent = 'Loading';
        var done = false;
        function handoff() {
          if (done) return;
          done = true;
          if (typeof replayTimer !== 'undefined' && replayTimer) clearInterval(replayTimer);
          boot.className = 'gone';
          setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 360);
        }
        // React 一旦往 #root 里挂了东西，就说明界面可用 ⇒ 交接
        // 反复「重新摆爱心」：每个循环重建一次里面的 <i>，CSS 动画就会从头再播一遍
        var BEADS = [{"y":1,"x":3,"color":"#17656a"},{"y":1,"x":4,"color":"#17656a"},{"y":1,"x":8,"color":"#17656a"},{"y":1,"x":9,"color":"#f0c84b"},{"y":2,"x":2,"color":"#17656a"},{"y":2,"x":3,"color":"#17656a"},{"y":2,"x":4,"color":"#17656a"},{"y":2,"x":5,"color":"#17656a"},{"y":2,"x":7,"color":"#17656a"},{"y":2,"x":8,"color":"#17656a"},{"y":2,"x":9,"color":"#f0c84b"},{"y":2,"x":10,"color":"#17656a"},{"y":3,"x":1,"color":"#17656a"},{"y":3,"x":2,"color":"#17656a"},{"y":3,"x":3,"color":"#17656a"},{"y":3,"x":4,"color":"#17656a"},{"y":3,"x":5,"color":"#17656a"},{"y":3,"x":6,"color":"#f0c84b"},{"y":3,"x":7,"color":"#17656a"},{"y":3,"x":8,"color":"#17656a"},{"y":3,"x":9,"color":"#17656a"},{"y":3,"x":10,"color":"#17656a"},{"y":3,"x":11,"color":"#17656a"},{"y":4,"x":1,"color":"#17656a"},{"y":4,"x":2,"color":"#f0c84b"},{"y":4,"x":3,"color":"#17656a"},{"y":4,"x":4,"color":"#17656a"},{"y":4,"x":5,"color":"#17656a"},{"y":4,"x":6,"color":"#17656a"},{"y":4,"x":7,"color":"#17656a"},{"y":4,"x":8,"color":"#17656a"},{"y":4,"x":9,"color":"#f0c84b"},{"y":4,"x":10,"color":"#17656a"},{"y":4,"x":11,"color":"#17656a"},{"y":5,"x":1,"color":"#17656a"},{"y":5,"x":2,"color":"#17656a"},{"y":5,"x":3,"color":"#17656a"},{"y":5,"x":4,"color":"#17656a"},{"y":5,"x":5,"color":"#f0c84b"},{"y":5,"x":6,"color":"#17656a"},{"y":5,"x":7,"color":"#17656a"},{"y":5,"x":8,"color":"#17656a"},{"y":5,"x":9,"color":"#17656a"},{"y":5,"x":10,"color":"#17656a"},{"y":5,"x":11,"color":"#17656a"},{"y":6,"x":2,"color":"#f0c84b"},{"y":6,"x":3,"color":"#17656a"},{"y":6,"x":4,"color":"#17656a"},{"y":6,"x":5,"color":"#17656a"},{"y":6,"x":6,"color":"#17656a"},{"y":6,"x":7,"color":"#17656a"},{"y":6,"x":8,"color":"#17656a"},{"y":6,"x":9,"color":"#f0c84b"},{"y":6,"x":10,"color":"#17656a"},{"y":7,"x":3,"color":"#17656a"},{"y":7,"x":4,"color":"#17656a"},{"y":7,"x":5,"color":"#17656a"},{"y":7,"x":6,"color":"#17656a"},{"y":7,"x":7,"color":"#17656a"},{"y":7,"x":8,"color":"#f0c84b"},{"y":7,"x":9,"color":"#17656a"},{"y":8,"x":4,"color":"#17656a"},{"y":8,"x":5,"color":"#17656a"},{"y":8,"x":6,"color":"#17656a"},{"y":8,"x":7,"color":"#17656a"},{"y":8,"x":8,"color":"#17656a"},{"y":9,"x":5,"color":"#f0c84b"},{"y":9,"x":6,"color":"#17656a"},{"y":9,"x":7,"color":"#17656a"},{"y":10,"x":6,"color":"#17656a"}];
        var CELL_MS = 55;
        var CYCLE_MS = 10150;
        var heart = document.getElementById('bootHeart');
        var replayTimer = null;
        if (heart) {
          replayTimer = setInterval(function () {
            if (document.hidden) return; // 后台标签页不折腾
            var html = '';
            for (var i = 0; i < BEADS.length; i += 1) {
              var b = BEADS[i];
              var delay = (i * CELL_MS) + 'ms,' + (BEADS.length * CELL_MS + i * 70) + 'ms,0ms';
              html += '<i style="grid-area:' + b.y + '/' + b.x + ';background:' + b.color + ';animation-delay:' + delay + '"></i>';
            }
            heart.innerHTML = html;
          }, CYCLE_MS);
        }
        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) { observer.disconnect(); if (replayTimer) clearInterval(replayTimer); handoff(); }
        });
        observer.observe(root, { childList: true });
        if (root.childNodes.length > 0) handoff();
        // 兜底：万一 React 起不来，也不能让动画永远盖着页面。
        // ⚠️ 30 秒太长不行、10 秒更不行 —— 实测线上冷启动要 ~30 秒才挂载，
        //    10 秒兜底会把加载页提前撤掉，中间留一块白板（用户 2026-09-24 实测发现）。
        //    放 90 秒：正常情况永远轮不到它，真触发时留一条控制台提示便于排查。
        setTimeout(function () {
          if (done) return;
          try { console.warn('[boot] 90 秒内没有等到页面挂载，先放行；请检查模块是否加载失败。'); } catch (e) {}
          handoff();
        }, 90000);
      })();
    </script>
